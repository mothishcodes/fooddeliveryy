services:

  mysql:
    image: mysql:8
    container_name: fooddelivery-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fooddelivery
    ports:
      - "3306:3306"

  redis:
    image: redis:latest
    container_name: fooddelivery-redis
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:latest
    container_name: fooddelivery-kafka
    ports:
      - "9092:9092"

